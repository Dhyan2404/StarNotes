name: 2. Build & Sign Recompiled APK

on:
  workflow_dispatch:
  push:
    paths:
      - "decompiled/apktool_project/**"
      - ".github/workflows/build_apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Tools (Latest Apktool & uber-apk-signer & zipalign)
        run: |
          echo "=== Installing Build Tools ==="
          sudo apt-get update -qq
          sudo apt-get install -y zipalign aapt

          echo "=== Downloading Latest Apktool v2.10.0 ==="
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /opt/apktool.jar

          echo "=== Downloading uber-apk-signer ==="
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O /opt/uber-apk-signer.jar

          java -jar /opt/apktool.jar -version

      - name: Rebuild APK with Apktool (6GB Heap)
        run: |
          mkdir -p dist
          echo "Building APK from decompiled/apktool_project..."
          java -Xmx6G -jar /opt/apktool.jar b -f decompiled/apktool_project -o dist/StarNotes_unsigned.apk --use-aapt2 || \
          java -Xmx6G -jar /opt/apktool.jar b -f decompiled/apktool_project -o dist/StarNotes_unsigned.apk

          if [ ! -f "dist/StarNotes_unsigned.apk" ]; then
            echo "Error: dist/StarNotes_unsigned.apk was not created!"
            exit 1
          fi
          echo "Unsigned APK build succeeded: $(ls -lh dist/StarNotes_unsigned.apk)"

      - name: Sign APK (Debug Key)
        run: |
          echo "Signing APK with uber-apk-signer..."
          java -jar /opt/uber-apk-signer.jar \
            --apks dist/StarNotes_unsigned.apk \
            --out dist/signed/ \
            --allowResign \
            --overwrite

          SIGNED_APK=$(find dist/signed/ -name "*.apk" | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" dist/StarNotes_rebuilt.apk
            echo "Signed APK ready: $(ls -lh dist/StarNotes_rebuilt.apk)"
          else
            echo "Error: Signed APK not found"
            exit 1
          fi

      - name: Upload Rebuilt APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarNotes-Rebuilt-APK
          path: dist/StarNotes_rebuilt.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.3.0-unlocked"
          name: "StarNotes v1.3.0 (VIP & Quotas Unlocked)"
          body: "StarNotes APK rebuilt with infinite notes quota, permanent VIP status, and quota restrictions removed."
          files: dist/StarNotes_rebuilt.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
