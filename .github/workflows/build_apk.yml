name: 2. Build & Sign Recompiled APK

on:
  workflow_dispatch:
  push:
    paths:
      - "decompiled/apktool_project/**"
      - "StarNote_v1.3.0.apk"
      - ".github/workflows/build_apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install Apktool & uber-apk-signer
        run: |
          echo "=== Installing zipalign ==="
          sudo apt-get update -qq
          sudo apt-get install -y zipalign

          echo "=== Downloading Apktool 3.0.3 ==="
          wget -q https://bitbucket.org/iBotPeaches/apktool/downloads/apktool_3.0.3.jar -O "$RUNNER_TEMP/apktool.jar"
          java -jar "$RUNNER_TEMP/apktool.jar" --version

          echo "=== Downloading uber-apk-signer ==="
          wget -q https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O "$RUNNER_TEMP/uber-apk-signer.jar"

      - name: Rebuild APK with Apktool
        run: |
          if [ ! -d "decompiled/apktool_project" ]; then
            echo "Error: decompiled/apktool_project does not exist yet. Please run decompile workflow first."
            exit 1
          fi

          if [ ! -f "StarNote_v1.3.0.apk" ]; then
            echo "Error: StarNote_v1.3.0.apk is required to restore build metadata, assets, and native libraries."
            exit 1
          fi

          mkdir -p dist
          echo "Decoding original APK to restore the complete build inputs..."
          java -jar "$RUNNER_TEMP/apktool.jar" d -f StarNote_v1.3.0.apk -o dist/apktool_project

          echo "Applying edited resources and smali..."
          cp -a decompiled/apktool_project/. dist/apktool_project/

          echo "Rebuilding APK from the complete patched project..."
          java -jar "$RUNNER_TEMP/apktool.jar" b dist/apktool_project -o dist/StarNotes_unsigned.apk

      - name: Sign APK (Debug Key)
        run: |
          echo "Signing APK with uber-apk-signer..."
          java -jar "$RUNNER_TEMP/uber-apk-signer.jar" \
            --apks dist/StarNotes_unsigned.apk \
            --out dist/signed/ \
            --allowResign

          # Find the signed apk
          SIGNED_APK=$(find dist/signed/ -name "*.apk" | head -n 1)
          if [ -n "$SIGNED_APK" ]; then
            cp "$SIGNED_APK" dist/StarNotes_rebuilt.apk
            echo "Signed APK ready at dist/StarNotes_rebuilt.apk"
          else
            echo "Error: Signed APK not found"
            exit 1
          fi

      - name: Upload Rebuilt APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarNotes-Rebuilt-APK
          path: dist/StarNotes_rebuilt.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.3.0-rebuilt"
          name: "StarNotes Rebuilt APK"
          body: "Automated build of StarNotes from decompiled source modifications."
          files: dist/StarNotes_rebuilt.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
