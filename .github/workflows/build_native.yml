name: Build Native StarNotes APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew*"
      - ".github/keystores/**"
      - ".github/workflows/build_native.yml"
  pull_request:
    paths:
      - "app/**"
      - "*.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew*"
      - ".github/keystores/**"
      - ".github/workflows/build_native.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: native-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout standalone app
        uses: actions/checkout@v4
        with:
          lfs: false
          sparse-checkout: |
            .github
            app
            gradle
            build.gradle
            settings.gradle
            gradlew
            gradlew.bat

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK & Environment
        run: |
          echo "ANDROID_HOME is $ANDROID_HOME"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify signing configuration
        run: |
          test -f .github/keystores/starnotes-development.jks
          keytool -list -keystore .github/keystores/starnotes-development.jks -storepass android -alias androiddebugkey

      - name: Compile, test, and check app
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug --stacktrace 2>&1 | tee build.log

      - name: Upload build log and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: StarNotes-build-reports
          path: |
            build.log
            app/build/reports/
            app/build/test-results/
          retention-days: 14

      - name: Verify and package signed APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/StarNotes_v1.0.1_offline.apk
          sha256sum dist/StarNotes_v1.0.1_offline.apk > dist/StarNotes_v1.0.1_offline.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StarNotes-Native-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish downloadable APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1-native
          name: StarNotes 1.0.1 — Offline
          body: Offline text notes and drawing. No account or network permission. Signed APK with SHA-256 checksum; build, tests, and Android lint passed.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
