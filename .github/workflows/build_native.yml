name: Build Native StarNotes APK

on:
  push:
    paths:
      - "app/**"
      - "*.gradle"
      - ".github/workflows/build_native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x gradlew

      - name: Build Android APK
        run: |
          ./gradlew assembleDebug assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace

      - name: Upload Build Reports on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-reports
          path: app/build/reports/

      - name: Locate Built APK
        id: locate_apk
        run: |
          APK_FILE=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Error: No APK file generated!"
            exit 1
          fi
          echo "Found APK: $APK_FILE"
          cp "$APK_FILE" StarNotes_v1.0_native.apk
          echo "apk_path=StarNotes_v1.0_native.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarNotes-Native-APK
          path: StarNotes_v1.0_native.apk
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "v1.0.0-native"
          name: "StarNotes v1.0.0 (Native Offline - No Login)"
          body: "100% Native, Offline, Free StarNotes Android APK with infinite notes, local SQLite database, and canvas drawing support."
          files: StarNotes_v1.0_native.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
